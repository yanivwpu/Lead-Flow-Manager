# Active Partner / production app config. Deploy: shopify app deploy --config shopify.app.whachatcrm.toml
# All app URLs and compliance webhooks use https://app.whachatcrm.com

client_id = "e4585d4da1434c9e5649a2269e716076"
name = " WhachatCRM"
application_url = "https://app.whachatcrm.com"
embedded = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  # Commerce — registered at app level via deploy; per-shop GraphQL registration also runs on OAuth install.
  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/customers-create"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "https://app.whachatcrm.com/api/shopify/webhooks/customers-update"

  # Phase 1B scope changes only. Scope-dependent catalog topics are registered per shop after consent.
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://app.whachatcrm.com/api/shopify/catalog-webhooks/app-scopes_update"

[access_scopes]
# Required install scopes stay in sync with server/shopify.ts.
# Catalog access is approved explicitly through the existing optional-scope flow.
scopes = "read_customers,read_orders"
optional_scopes = [ "read_products", "read_inventory" ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://app.whachatcrm.com/api/shopify/callback" ]
