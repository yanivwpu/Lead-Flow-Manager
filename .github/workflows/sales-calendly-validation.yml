name: Sales Calendly isolated validation
on:
  pull_request:
    paths:
      - "server/marketingDemoCalendly*"
      - "server/salespersonCalendlyConnections.ts"
      - "server/routes.ts"
      - "client/src/pages/SalesPortal.tsx"
      - "shared/marketingDemoCalendly*"
      - "tests/marketing-demo*"
      - "tests/demo-unscheduled-assignment.test.ts"
      - "migrations/0056_salesperson_calendly_connections.sql"
      - ".github/workflows/sales-calendly-validation.yml"
  workflow_dispatch:

jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NODE_ENV: test
      SESSION_SECRET: isolated-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply salesperson Calendly migration on disposable database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE salespeople (id varchar PRIMARY KEY);'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0056_salesperson_calendly_connections.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0056_salesperson_calendly_connections.sql
          test "$(psql "$DATABASE_URL" -At -c "SELECT to_regclass('public.salesperson_calendly_connections') IS NOT NULL")" = "t"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO salespeople (id) VALUES ('test-salesperson')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO salesperson_calendly_connections (salesperson_id, encrypted_access_token) VALUES ('test-salesperson', 'encrypted-placeholder')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM salespeople WHERE id = 'test-salesperson'"
          test "$(psql "$DATABASE_URL" -At -c 'SELECT count(*) FROM salesperson_calendly_connections')" = "0"
      - name: Booking matching regression
        run: npx tsx --test tests/marketing-demo-calendly-reconciliation.test.ts
      - name: Existing demo lifecycle tests
        run: npx tsx --test tests/marketing-demo-webhook.test.ts tests/demo-unscheduled-assignment.test.ts
