name: Marketing Phase 1 validation
on:
  pull_request:
    paths:
      - 'server/marketingCompliance/**'
      - 'server/emailChannel/**'
      - 'server/prospectImport/**'
      - 'shared/prospect*'
      - 'shared/safeTextLinks.ts'
      - 'server/userMeta.ts'
      - 'server/userTwilio.ts'
      - 'server/channelAdapters.ts'
      - 'migrations/0113_marketing_compliance.sql'
      - 'migrations/0114_prospect_link_rendering_snapshot.sql'
      - 'scripts/verify-marketing-schema.ts'
      - 'client/src/locales/*.json'
      - 'tests/marketing-*'
      - '.github/workflows/marketing-phase1-validation.yml'
      - 'client/src/components/ContactSuppressionStatus.tsx'
      - 'client/src/components/SafeMessageText.tsx'
      - 'client/src/components/settings/Marketing*'
      - 'client/src/components/settings/CampaignQueueDraftDialog.tsx'
      - 'client/src/pages/ContactDetails.tsx'
      - 'client/src/pages/UnifiedInbox.tsx'
      - 'client/src/pages/Settings.tsx'
permissions:
  contents: read
jobs:
  mocked-compliance:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/isolated_tests
      MARKETING_SENDS_ENABLED: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: |
          if [ -f tests/marketing-compliance-locales.test.ts ]; then node --import tsx tests/marketing-compliance-locales.test.ts; fi
          node --import tsx tests/marketing-compliance.test.ts
          node --import tsx tests/marketing-compliance-db.test.ts
          node --import tsx tests/marketing-send-boundary.test.ts
          node --import tsx tests/marketing-inbound-retry.test.ts
          node --import tsx tests/marketing-queue-accounting.test.ts
          if [ -f tests/marketing-preview-cache.test.ts ]; then node --import tsx tests/marketing-preview-cache.test.ts; fi
          node --import tsx tests/contact-details-render.test.ts
          node --import tsx tests/contact-automations-pause.test.ts
          node --import tsx tests/prospect-email-suppression.test.ts
          node --import tsx tests/prospect-outreach-email-html.test.ts
          node --import tsx tests/prospect-outreach-writing-standard.test.ts
          node --import tsx tests/prospect-campaign-readiness-batch-db.test.ts

  postgres-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: marketing_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d marketing_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MARKETING_TEST_DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/marketing_phase1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx tests/marketing-postgres-concurrency.test.ts
