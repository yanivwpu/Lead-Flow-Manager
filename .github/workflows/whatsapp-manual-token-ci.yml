name: Manual WhatsApp token rotation

on:
  pull_request:
    branches:
      - codex/shopify-trial-first-onboarding
    paths:
      - server/metaManualTokenReplacement.ts
      - shared/manualMetaTokenReplacementValidation.ts
      - client/src/components/ConnectWhatsAppHub.tsx
      - server/routes/whatsappIntegrationRoutes.ts
      - server/whatsappEmbeddedSignup.ts
      - tests/whatsapp-manual-token-replacement.test.ts
      - .github/workflows/whatsapp-manual-token-ci.yml

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test manual token renewal safety rules
        run: npx tsx tests/whatsapp-manual-token-replacement.test.ts
      - name: TypeScript validation
        run: npm run check
      - name: Build staging frontend and backend
        run: npm run build
