name: Staging database bootstrap validation
on:
  pull_request:
    paths:
      - "scripts/bootstrap-staging-db.mjs"
      - "script/generate-staging-schema.ts"
      - "tests/staging-database-bootstrap.test.ts"
      - "shared/schema.ts"
      - "server/startupSchemaPatches.ts"
      - "package.json"
      - ".github/workflows/staging-database-bootstrap.yml"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staging_test
          POSTGRES_PASSWORD: staging_test
          POSTGRES_DB: whachat_staging_bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staging_test -d whachat_staging_bootstrap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STAGING_TEST_DATABASE_URL: postgres://staging_test:staging_test@127.0.0.1:5432/whachat_staging_bootstrap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build staging artifact without database credentials
        run: npm run build:staging
      - name: Real empty PostgreSQL bootstrap and existing startup patches
        run: npx --no-install tsx --test tests/staging-database-bootstrap.test.ts
