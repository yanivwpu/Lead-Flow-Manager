name: Shopify onboarding validation
on:
  pull_request:
    paths:
      - "shopify.app.staging.toml"
      - "shopify.app.whachatcrm.toml"
      - "server/commerceEventPipeline.ts"
      - "scripts/verify-shopify-order-recovery.ts"
      - "scripts/monitor-shopify-privacy.ts"
      - "tests/shopify-production-config.test.py"
      - "scripts/validate-shopify-staging.py"
      - "tests/shopify-staging-config.test.py"
      - "server/shopifyWebhookRegistration.ts"
      - "tests/shopify-webhook-registration.test.ts"
      - "scripts/smoke-shopify-privacy-email.ts"
      - "server/shopifyPrivacySmokeSafety.ts"
      - "tests/shopify-privacy-smoke-safety.test.ts"
      - "script/build.ts"
      - "docs/shopify-privacy-staging-smoke.md"
      - "server/shopify*.ts"
      - "server/ecommerce/**"
      - "client/src/components/integrations/ShopifyEcommerceInboxPreview.tsx"
      - "client/src/components/integrations/ShopifySimpleSetup.tsx"
      - "client/src/components/integrations/ShopifyManagePanel.tsx"
      - "client/src/components/followups/ShopifyOrderSupportTasks.tsx"
      - "client/src/components/followups/ShopifyTaskScheduleEditor.tsx"
      - "migrations/20261020_ecommerce_task_schedule_staging.sql"
      - "client/src/pages/FollowUps.tsx"
      - "client/src/pages/ContactDetails.tsx"
      - "shared/contactDetails.ts"
      - "shared/shopify*.ts"
      - "client/index.html"
      - "client/src/App.tsx"
      - "client/src/pages/AppLayout.tsx"
      - "client/src/pages/ShopifyStart.tsx"
      - "client/src/pages/EcommerceGrowthEnginePreview.tsx"
      - "client/src/components/Shopify*.tsx"
      - "client/src/components/integrations/ShopifyWebhook*.tsx"
      - "client/src/components/admin/AdminShopifyWebhookHealth.tsx"
      - "client/src/lib/shopify*.ts"
      - "tests/ecommerce-checkout-recovery-eligibility.test.ts"
      - "tests/ecommerce-abandoned-checkout-source.test.ts"
      - "tests/ecommerce-checkout-sync-gate.test.ts"
      - "tests/ecommerce-checkout-observations-postgres.test.ts"
      - "migrations/20261020_ecommerce_abandoned_checkout_observations.sql"
      - "migrations/20261020_ecommerce_checkout_recovery_intents.sql"
      - "migrations/20261020_ecommerce_whatsapp_recovery_delivery.sql"
      - "migrations/20261020_ecommerce_recovery_signed_inbound_consent.sql"
      - "migrations/20261020_ecommerce_recovery_meta_receipts.sql"
      - "tests/shopify*.test.ts"
      - "tests/shopify*.test.tsx"
      - "scripts/check-types-against-base.mjs"
      - ".github/workflows/shopify-onboarding-validation.yml"
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopify_test
          POSTGRES_PASSWORD: shopify_test
          POSTGRES_DB: whachat_shopify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopify_test -d whachat_shopify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
      SHOPIFY_TEST_DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Onboarding behavior, HTTP session recovery, and real PostgreSQL atomicity
        run: |
          npx tsx --test tests/shopify-trial-first.test.tsx tests/shopify-onboarding-routes.test.ts tests/shopify-login-session.test.ts tests/shopify-oauth-navigation.test.tsx tests/shopify-first-use-handoff.test.ts
          npx tsx --test tests/shopify-trial-provisioning-postgres.test.ts
      - name: Staging configuration, identity guard, and idempotent registration
        run: |
          python3 tests/shopify-staging-config.test.py
          python3 tests/shopify-production-config.test.py
          npx tsx --test tests/shopify-webhook-registration.test.ts
      - name: Fail-closed scope and webhook verification regressions
        run: npx tsx --test tests/shopify-webhook-health.test.ts tests/shopify-webhook-health-ui.test.tsx
      - name: Durable order delivery and interrupted-write recovery
        run: |
          npx tsx --test tests/shopify-order-webhook.test.ts tests/shopify-order-persistence.test.ts tests/shopify-privacy-request-encryption.test.ts tests/shopify-privacy-monitoring.test.ts
          SHOPIFY_RECOVERY_DATABASE_URL="$SHOPIFY_TEST_DATABASE_URL" SHOPIFY_RECOVERY_FIXTURE_ACK=isolated-staging-schema npx tsx scripts/verify-shopify-order-recovery.ts --local-validation
      - name: Existing Shopify eligibility, billing, OAuth, and compliance regressions
        run: |
          npx tsx tests/shopify-shop-trial-ledger.test.ts
          npx tsx tests/shopify-shop-trial-reconciliation.test.ts
          npx tsx --test tests/shopify-managed-pricing.test.ts tests/shopify-oauth-state.test.ts tests/shopify-onboarding-emails.test.ts
      - name: Staging-only E-commerce inbox preview access and read-only checks
        run: npx tsx --test tests/shopify-ecommerce-preview.test.ts
      - name: Merchant preview locale, connection states and real link rendering
        run: npx tsx --test tests/shopify-ecommerce-ui-render.test.ts
      - name: E-commerce manual review security and concurrent real PostgreSQL gate
        run: npx tsx --test tests/shopify-ecommerce-review-security.test.ts tests/shopify-ecommerce-review-postgres.test.ts
      - name: E-commerce merchant workflow draft parser, security and real PostgreSQL concurrency
        run: npx tsx --test tests/shopify-ecommerce-workflow-drafts.test.ts tests/shopify-ecommerce-workflow-drafts-postgres.test.ts
      - name: E-commerce order-support task execution gate and native PostgreSQL dedupe
        run: npx tsx --test tests/ecommerce-order-support-tasks.test.ts tests/ecommerce-order-support-postgres.test.ts
      - name: Internal order task merchant controls, ownership and PostgreSQL concurrency
        run: npx tsx --test tests/shopify-ecommerce-order-task-controls.test.ts tests/shopify-ecommerce-order-task-controls-postgres.test.ts
      - name: Staging-only E-commerce task migration guard and actual PostgreSQL DDL
        run: npx tsx --test tests/ecommerce-task-schema-migration.test.ts
      - name: Shopify task bridge into regular Follow-Ups with native tenant isolation
        run: npx tsx --test tests/shopify-followups-task-bridge-postgres.test.ts
      - name: Shopify support task links to exact tenant-owned order cards
        run: npx tsx --test tests/shopify-task-order-deeplink-postgres.test.ts
      - name: Shopify task ownership due dates and in-app reminder PostgreSQL checks
        run: npx tsx --test tests/shopify-task-schedule-postgres.test.ts
      - name: "One-click Shopify order support: safe endpoint, UI and atomic native PostgreSQL"
        run: npx tsx --test tests/shopify-simple-order-support.test.ts tests/shopify-simple-order-support-postgres.test.ts
      - name: Checkout recovery eligibility must fail closed before any send plumbing
        run: npx tsx --test tests/ecommerce-checkout-recovery-eligibility.test.ts
      - name: Abandoned checkout observation source, gating and native SQL cancellation
        run: npx tsx --test tests/ecommerce-abandoned-checkout-source.test.ts tests/ecommerce-checkout-sync-gate.test.ts tests/ecommerce-checkout-observations-postgres.test.ts
      - name: Exact purchase recheck, safe review preparation and durable intent SQL
        run: npx tsx --test tests/ecommerce-checkout-fresh-recheck.test.ts tests/ecommerce-checkout-recovery-preparation-gate.test.ts tests/ecommerce-checkout-recovery-intents-postgres.test.ts
      - name: Checkout recovery opt-in and Meta-template live delivery safety
        run: npx tsx --test tests/ecommerce-recovery-messaging-eligibility.test.ts tests/ecommerce-recovery-delivery-worker.test.ts tests/ecommerce-recovery-outbox-postgres.test.ts
      - name: Recovery outbox and consent safe uninstall and redaction
        run: npx tsx --test tests/ecommerce-recovery-privacy-postgres.test.ts
      - name: Strict Shopify recovery Meta marketing template and final send guard
        run: npx tsx --test tests/ecommerce-recovery-meta-adapter.test.ts
      - name: Signed Meta recovery consent and opt-out privacy lifecycle
        run: npx tsx --test tests/ecommerce-recovery-signed-inbound-consent-gate.test.ts tests/ecommerce-recovery-consent-webhook-contract.test.ts tests/ecommerce-recovery-signed-consent-postgres.test.ts
      - name: Recovery worker test-store isolation and signed Meta delivery receipts
        run: npx tsx --test tests/ecommerce-recovery-meta-receipts.test.ts tests/ecommerce-recovery-meta-receipts-postgres.test.ts tests/ecommerce-recovery-worker-scheduler.test.ts
      - name: Staging checkout auto-preparation stops on purchase or missing consent
        run: npx tsx --test tests/ecommerce-recovery-auto-preparation.test.ts
      - name: Verify controlled Shopify development-store probe is non-mutating
        run: npx tsx --test tests/ecommerce-controlled-staging-runbook.test.ts
      - name: E-commerce landing preview remains staged and honest
        run: npx tsx --test tests/shopify-ecommerce-landing-preview.test.ts
      - name: Reject TypeScript regressions against the exact PR base
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
