name: Shopify onboarding validation
on:
  pull_request:
    paths:
      - "server/shopify*.ts"
      - "shared/shopify*.ts"
      - "client/index.html"
      - "client/src/App.tsx"
      - "client/src/pages/AppLayout.tsx"
      - "client/src/pages/ShopifyStart.tsx"
      - "client/src/components/Shopify*.tsx"
      - "client/src/lib/shopify*.ts"
      - "tests/shopify*.test.ts"
      - "tests/shopify*.test.tsx"
      - "scripts/check-types-against-base.mjs"
      - ".github/workflows/shopify-onboarding-validation.yml"
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopify_test
          POSTGRES_PASSWORD: shopify_test
          POSTGRES_DB: whachat_shopify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopify_test -d whachat_shopify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
      SHOPIFY_TEST_DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Onboarding behavior, HTTP session recovery, and real PostgreSQL atomicity
        run: |
          npx tsx --test tests/shopify-trial-first.test.tsx tests/shopify-onboarding-routes.test.ts tests/shopify-login-session.test.ts
          npx tsx --test tests/shopify-trial-provisioning-postgres.test.ts
      - name: Existing Shopify eligibility, billing, OAuth, and compliance regressions
        run: |
          npx tsx tests/shopify-shop-trial-ledger.test.ts
          npx tsx tests/shopify-shop-trial-reconciliation.test.ts
          npx tsx --test tests/shopify-managed-pricing.test.ts tests/shopify-oauth-state.test.ts tests/shopify-onboarding-emails.test.ts
      - name: Reject TypeScript regressions against the exact PR base
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
