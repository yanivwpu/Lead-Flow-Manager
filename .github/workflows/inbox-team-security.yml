name: Inbox team security
on:
  pull_request:
    paths:
      - 'server/auth.ts'
      - 'shared/inboxTeam.ts'
      - 'server/inboxTeamProfiles.ts'
      - 'server/channelService.ts'
      - 'server/emailChannel/sendService.ts'
      - 'server/routes/templates.ts'
      - 'client/src/pages/UnifiedInbox.tsx'
      - 'client/src/components/Inbox*.tsx'
      - 'client/src/components/AIComposer.tsx'
      - 'client/src/components/inbox/conversation/EmailThreadMessage.tsx'
      - 'tests/inbox-team-ownership.test.ts'
      - 'server/teamInvitations.ts'
      - 'server/email.ts'
      - 'client/src/pages/TeamInvitation.tsx'
      - 'client/src/components/InboxWorkspaceSelector.tsx'
      - 'client/src/lib/teamInvitationReturn.ts'
      - 'client/src/pages/Auth.tsx'
      - 'client/src/pages/CheckEmail.tsx'
      - 'client/src/pages/VerifyEmail.tsx'
      - 'client/src/pages/Settings.tsx'
      - 'client/src/pages/AppLayout.tsx'
      - 'client/src/App.tsx'
      - 'client/src/locales/*.json'
      - 'tests/team-invitation-return.test.ts'
      - 'tests/check-email-verification-ux.test.ts'
      - 'tests/email-verification-tabs.test.ts'
      - 'server/presence.ts'
      - 'server/inbox*.ts'
      - 'server/routes/inboxSendState.ts'
      - 'server/worker.ts'
      - 'server/webchatAiAutoReply.ts'
      - 'server/userMeta.ts'
      - 'server/marketingCompliance/store.ts'
      - 'client/src/lib/useInboxCollaboration.ts'
      - 'tests/inbox-collaboration*.ts'
      - 'tests/inbox-reply-conflict.test.ts'
      - 'tests/helpers/inboxCollaborationProcess.ts'
      - 'migrations/*inbox_collaboration.sql'
      - 'server/inboxWorkspace*.ts'
      - 'server/inboxContentRateLimit.ts'
      - 'server/rateLimitMiddleware.ts'
      - 'server/contactPatchSecurity.ts'
      - 'server/contactDetailsRoute.ts'
      - 'server/routes.ts'
      - 'server/routes/contacts.ts'
      - 'server/routes/conversations.ts'
      - 'server/routes/emailChannel.ts'
      - 'server/routes/inboxWorkspace.ts'
      - 'server/storage.ts'
      - 'server/index.ts'
      - 'shared/schema.ts'
      - 'tests/inbox-team-security.test.ts'
      - 'tests/inbox-content-rate-limit.test.ts'
      - 'package*.json'
      - '.github/workflows/inbox-team-security.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: codex_inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
      AI_INTEGRATIONS_OPENAI_API_KEY: synthetic-test-key
      EMAIL_IMAGE_PROXY_SECRET: synthetic-inbox-image-secret-000000
      EMAIL_ENCRYPTION_KEY: synthetic-inbox-email-secret-000000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Session-backed HTTP, WebSocket and SQL authorization regressions
        run: node --import tsx --test tests/inbox-team-security.test.ts tests/inbox-content-rate-limit.test.ts tests/team-invitation-return.test.ts tests/inbox-team-ownership.test.ts tests/inbox-reply-conflict.test.ts
      - name: PostgreSQL cross-process concurrency and authenticated presence
        env:
          TEST_DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/codex_inbox
        run: node --import tsx --test tests/inbox-collaboration-postgres.test.ts tests/inbox-collaboration-connection.test.ts
      - name: Existing ownership, auth and Inbox contracts
        run: >-
          node --import tsx --test
          tests/account-switch-auth-isolation.test.ts tests/contact-details.test.ts
          tests/contact-details-concurrency.test.ts tests/contact-automations-pause.test.ts
          tests/inbox-auto-refresh-send.test.ts tests/inbox-auto-polling-harness.test.ts
          tests/inbox-selection-isolation.test.ts tests/inbox-channel-adaptive-conversation.test.ts
          tests/inbox-new-activity-badge.test.ts tests/inbox-deep-link-and-perf.test.ts
          tests/auth-security-fix.test.ts tests/auth-login-rate-limit.test.ts tests/webchat-tenant-isolation.test.ts
          tests/email-verification-flow.test.ts tests/email-verification-tabs.test.ts
          tests/check-email-verification-ux.test.ts tests/auth-signup-hardening.test.ts tests/http-access-log-redaction.test.ts
          tests/webchat-ui-controls.test.ts tests/native-email-channel-1a.test.ts
          tests/inbox-channel-health-bar.test.ts tests/inbox-list-loading.test.ts tests/inbox-list-merge.test.ts
          tests/automation-send-guard.test.ts tests/booking-fast-path.test.ts tests/chatbot-ai-completion-context.test.ts
          tests/webchat-ai-generation-guard.test.ts tests/webchat-generation-recovery.test.ts tests/marketing-compliance.test.ts
      - name: CRM activity, contact display and reminder recommendations
        run: >-
          node --import tsx --test
          tests/crm-contacts-activity.test.ts tests/contact-details-route.test.ts
          tests/contact-details-render.test.ts tests/follow-up-tasks.test.ts tests/follow-up-views.test.ts
      - name: Reject new TypeScript diagnostics
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - run: npm run build
      - run: git diff --check
