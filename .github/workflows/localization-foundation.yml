name: Localization foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/localization/check.mjs
      - run: node --import tsx --test tests/{localization-foundation,localization-crm-controls,contact-details-render,inbox-localization,inbox-reply-language,authenticated-locale,user-language-preference,marketing-locale-navigation,phase2-locale-seo,pricing-rtl-layout,chatbot-builder-locale-dir,webchat-widget-locale,webchat-page-rule-locale-sync}.test.ts
