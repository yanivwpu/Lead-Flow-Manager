name: Shopify pilot preview offline validation
on:
  pull_request:
    paths:
      - 'scripts/shopify-pilot/**'
      - 'tests/pilot-preview-workflow.test.ts'
      - '.github/workflows/shopify-pilot-preview*.yml'
permissions:
  contents: read
concurrency:
  group: shopify-preview-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Credential-free preview regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test tests/pilot-preview-workflow.test.ts
