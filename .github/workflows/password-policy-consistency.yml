name: Password policy consistency
on:
  pull_request:
    paths:
      - 'server/passwordPolicy.ts'
      - 'server/portalPasswordReset.ts'
      - 'client/src/pages/Auth.tsx'
      - 'client/src/pages/ResetPassword.tsx'
      - 'client/src/pages/PortalResetPassword.tsx'
      - 'client/src/locales/*.json'
      - 'tests/auth-security-fix.test.ts'
      - 'tests/portal-password-reset.test.ts'
      - '.github/workflows/password-policy-consistency.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Signup, single-use reset, and partner/sales password policy
        run: >-
          node --import tsx --test
          tests/auth-security-fix.test.ts
          tests/portal-password-reset.test.ts
      - name: Compare TypeScript diagnostics with main
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - run: git diff --check
