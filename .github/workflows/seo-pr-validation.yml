name: SEO PR PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/seo/**"
      - "tests/seo-*.test.ts"
      - ".github/workflows/seo-pr-validation.yml"

jobs:
  postgres-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seo_test
          POSTGRES_PASSWORD: seo_test
          POSTGRES_DB: seo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo_test -d seo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SEO_TEST_DATABASE_URL: postgres://seo_test:seo_test@127.0.0.1:5432/seo_test
      DATABASE_URL: postgres://seo_test:seo_test@127.0.0.1:5432/seo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run isolated PostgreSQL SEO regressions
        run: |
          npx tsx tests/seo-action-atomic-postgres.test.ts
          npx tsx tests/seo-action-history-postgres.test.ts
          npx tsx tests/seo-action-recovery-postgres.test.ts
          npx tsx tests/seo-action-refresh-lease-postgres.test.ts
          npx tsx tests/seo-analysis-lease-postgres.test.ts
          npx tsx tests/seo-legacy-refresh-runtime-postgres.test.ts
          npx tsx tests/seo-planner-candidates-postgres.test.ts
          npx tsx tests/seo-planner-snapshot-postgres.test.ts
          npx tsx tests/seo-snapshot-postgres.test.ts
          npx tsx tests/seo-execution-lease-concurrency.test.ts
