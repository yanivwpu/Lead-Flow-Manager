name: Sales Catalog validation
on:
  pull_request:
    paths:
      - "server/salesCatalog/**"
      - "server/shopping/**"
      - "scripts/checkout-validation/**"
      - "scripts/validate-shopify-checkout.ts"
      - "docs/shopify-checkout-controlled-validation.md"
      - "server/aiTestChat/**"
      - "shared/aiTestChat.ts"
      - "client/src/components/AiTestChat.tsx"
      - "client/src/pages/AIBrain.tsx"
      - "tests/ai-test-chat*.ts"
      - "tests/ai-test-chat*.tsx"
      - "migrations/0109_private_ai_test_chat.sql"
      - "shared/shoppingAssistant.ts"
      - "tests/shopping-assistant*.test.ts"
      - "tests/shopping-checkout*.test.ts"
      - "tests/shopify-checkout-admin-test.test.ts"
      - "client/src/components/ShopifyCheckoutTest.tsx"
      - "migrations/0112_shopify_checkout_admin_tests.sql"
      - "docs/shopify-checkout-admin-test.md"
      - "migrations/0110_checkout_preparation_attempts.sql"
      - "migrations/0111_checkout_provider_gates.sql"
      - "docs/shopify-checkout-phase2b-handoff.md"
      - "docs/shopify-checkout-phase2b.md"
      - "migrations/0108_conversation_shopping.sql"
      - "server/chatbotEngine.ts"
      - "client/src/components/ShoppingSettings.tsx"
      - "client/src/components/inbox/ShoppingActivity.tsx"
      - "client/src/pages/ChatbotBuilder.tsx"
      - "client/src/pages/UnifiedInbox.tsx"
      - "shared/salesCatalog.ts"
      - "shared/commerce*.ts"
      - "shared/turnEvidence.ts"
      - "shared/schema.ts"
      - "server/aiService.ts"
      - "server/flowJobWorker.ts"
      - "server/shopify*.ts"
      - "server/routes.ts"
      - "server/startupSchemaPatches.ts"
      - "migrations/0107_shared_commerce_catalog.sql"
      - "client/src/components/ShopifyCatalog*.tsx"
      - "tests/shopify-catalog*.ts"
      - "tests/shopify-catalog*.tsx"
      - "server/workspaceOffers/**"
      - "server/aiLiveBusinessData/**"
      - "shared/aiLiveBusinessData.ts"
      - "shared/appNav.ts"
      - "client/src/pages/SalesCatalog*.tsx"
      - "client/src/pages/AppLayout.tsx"
      - "client/src/components/settings/OffersPaymentLinksSettings.tsx"
      - "client/src/components/aibrain/BusinessKnowledgeSteps.tsx"
      - "client/src/lib/useAppNav.ts"
      - "client/src/locales/*.json"
      - "tests/sales-catalog*.test.ts"
      - "tests/sales-catalog*.test.tsx"
      - ".github/workflows/sales-catalog-validation.yml"
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_fixture_only
          POSTGRES_DB: whachat_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d whachat_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CATALOG_TEST_DATABASE_URL: postgres://catalog_test:catalog_fixture_only@127.0.0.1:5432/whachat_catalog_test
      # Unreachable app DB; tests inject isolated native/PGlite fixture databases.
      DATABASE_URL: postgres://fixture:fixture@127.0.0.1:1/catalog_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native PostgreSQL catalog sync, search, HTTP, grounding and UI
        run: node --import tsx --test tests/shopify-billing-return.test.ts tests/shopify-catalog-inventory.test.ts tests/shopify-catalog.test.ts tests/shopify-catalog-registration.test.ts tests/shopify-catalog-authorization.test.ts tests/shopify-catalog-publication.test.ts tests/shopify-catalog-card-state.test.ts tests/shopify-catalog-reconciliation.test.ts tests/shopify-catalog-search.test.ts tests/shopify-catalog-webhooks.test.ts tests/shopify-catalog-ai.test.ts tests/shopify-catalog-routes.test.ts tests/shopify-catalog-ui.test.tsx
      - name: Admin Shopify checkout safety
        env:
          # Use the existing in-memory fixture: the admin journal intentionally requires public schema.
          CATALOG_TEST_DATABASE_URL: ""
        run: node --import tsx --test tests/shopify-checkout-admin-test.test.ts tests/ai-test-chat-checkout.test.ts tests/shopping-checkout-execution-diagnostics.test.ts
      - name: Conversational shopping and PostgreSQL session integration
        run: |
          node --import tsx tests/shopping-checkout-harness.test.ts
          node --import tsx tests/shopping-checkout-bad-request.test.ts
          node --import tsx tests/shopping-checkout-http-diagnostic.test.ts
          node --import tsx tests/shopping-checkout-transport.test.ts
          node --import tsx tests/shopping-checkout.test.ts
          node --import tsx tests/shopping-checkout-postgres.test.ts
          node --import tsx tests/shopping-assistant.test.ts
          node --import tsx tests/shopping-assistant-postgres.test.ts
          node --import tsx tests/ai-test-chat.test.ts
          node --import tsx --test tests/ai-test-chat-ui.test.tsx tests/ai-test-chat-cart-ui.test.ts
      - name: Catalog integration and offer, AI, navigation compatibility
        run: |
          node --import tsx --test tests/sales-catalog-ui.test.tsx tests/sales-catalog-retrieval.test.ts tests/sales-catalog.test.ts tests/sales-catalog-provider.test.ts tests/workspace-offers.test.ts tests/ai-live-business-data.test.ts tests/app-nav-ia.test.ts tests/knowledge-fact-grounding.test.ts tests/growth-engine-pro-entitlement.test.ts
          # Two untouched Prospect AI artwork/quota layout assertions already fail on main.
          node --import tsx --test --test-name-pattern="^(authenticated|public|Growth Engine catalog)" tests/growth-engine-prospect-ai-routing.test.ts
      - name: Reject TypeScript regressions against PR base
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - name: Build
        run: npm run build



