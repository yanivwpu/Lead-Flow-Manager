name: E-commerce Growth Engine validation
on:
  pull_request:
    paths:
      - "server/ecommerce/**"
      - "server/shopifyCommerceWebhooks.ts"
      - "scripts/inspect-ecommerce-inbox.ts"
      - "docs/ecommerce-growth-engine-staging-runbook.md"
      - "tests/ecommerce-*.test.ts"
      - "migrations/20261019_ecommerce_growth_event_inbox.sql"
      - "migrations/20261020_ecommerce_abandoned_checkout_observations.sql"
      - "migrations/20261020_ecommerce_checkout_recovery_intents.sql"
      - "migrations/20261020_ecommerce_whatsapp_recovery_delivery.sql"
      - "migrations/20261020_ecommerce_recovery_signed_inbound_consent.sql"
      - "migrations/20261020_ecommerce_recovery_meta_receipts.sql"
      - "server/shopifyRoutes.ts"
      - "docs/ecommerce-growth-engine-phase2-boundary.md"
      - ".github/workflows/ecommerce-growth-validation.yml"
permissions:
  contents: read
jobs:
  ecommerce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce_test
          POSTGRES_PASSWORD: ecommerce_test
          POSTGRES_DB: whachat_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_test -d whachat_ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ECOMMERCE_TEST_DATABASE_URL: postgres://ecommerce_test:ecommerce_test@127.0.0.1:5432/whachat_ecommerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pure event classification and preview guards
        run: npx tsx --test tests/ecommerce-event-intake.test.ts tests/ecommerce-recording-bridge.test.ts
      - name: Checkout observation source and staging security checks
        run: npx tsx --test tests/ecommerce-abandoned-checkout-source.test.ts tests/ecommerce-checkout-sync-gate.test.ts
      - name: Exact Shopify checkout recheck and recovery prep safety
        run: npx tsx --test tests/ecommerce-checkout-fresh-recheck.test.ts tests/ecommerce-checkout-recovery-preparation-gate.test.ts
      - name: Purchase cancellation and durable recovery intent PostgreSQL concurrency
        run: npx tsx --test tests/ecommerce-checkout-recovery-intents-postgres.test.ts
      - name: Recovery WhatsApp opt-in, live template and guarded worker safety
        run: npx tsx --test tests/ecommerce-recovery-messaging-eligibility.test.ts tests/ecommerce-recovery-delivery-worker.test.ts
      - name: Native PostgreSQL consent, claim, uncertain acceptance and tenant isolation
        run: npx tsx --test tests/ecommerce-recovery-outbox-postgres.test.ts
      - name: Recovery consent and delivery GDPR cleanup in native PostgreSQL
        run: npx tsx --test tests/ecommerce-recovery-privacy-postgres.test.ts
      - name: Live-approved Meta checkout recovery adapter and outbox claim guard
        run: npx tsx --test tests/ecommerce-recovery-meta-adapter.test.ts
      - name: Signed WhatsApp inbound consent, STOP and replay-safe native PostgreSQL
        run: npx tsx --test tests/ecommerce-recovery-signed-inbound-consent-gate.test.ts tests/ecommerce-recovery-consent-webhook-contract.test.ts tests/ecommerce-recovery-signed-consent-postgres.test.ts
      - name: Signed Meta delivery receipt, monotonic PostgreSQL status and allowlisted worker
        run: npx tsx --test tests/ecommerce-recovery-meta-receipts.test.ts tests/ecommerce-recovery-meta-receipts-postgres.test.ts tests/ecommerce-recovery-worker-scheduler.test.ts
      - name: Single-merchant automatic checkout discovery and verified-consent enqueue
        run: npx tsx --test tests/ecommerce-recovery-auto-preparation.test.ts
      - name: Restore-first staging migration guard and one-store readonly acceptance probe
        run: npx tsx --test tests/ecommerce-controlled-staging-runbook.test.ts
      - name: PGlite persistence compatibility
        run: npx tsx --test tests/ecommerce-durable-event-inbox.test.ts
      - name: Native PostgreSQL 16 migration, concurrency and uniqueness
        run: npx tsx --test tests/ecommerce-postgres-inbox.test.ts
      - name: Checkout status cancellation, tenant separation, native PostgreSQL
        run: npx tsx --test tests/ecommerce-checkout-observations-postgres.test.ts
      - name: Read-only staging-schema inspection with no migration applied
        env:
          ECOMMERCE_PREFLIGHT_ACK: staging-read-only
          ECOMMERCE_PREFLIGHT_DATABASE_URL: postgres://ecommerce_test:ecommerce_test@127.0.0.1:5432/whachat_ecommerce_test
        run: npx tsx scripts/inspect-ecommerce-inbox.ts --read-only
      - name: Reject TypeScript regressions against PR base
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - name: Build
        run: npm run build
