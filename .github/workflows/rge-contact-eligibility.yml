name: RGE contact eligibility
on:
  pull_request:
    paths:
      - 'shared/aiDomainEligibility.ts'
      - 'shared/buyerPreference*.ts'
      - 'shared/inventoryContactEligibility.ts'
      - 'server/buyerPreferenceService.ts'
      - 'server/agentPage/**'
      - 'server/routes/*AgentPage.ts'
      - 'server/routes/agentPageSettings.ts'
      - 'server/routes/publicListings*.ts'
      - 'shared/agent/**'
      - 'shared/inventory/publicListing*.ts'
      - 'tests/public-agent-page*.test.ts'
      - 'tests/public-listing*.test.ts'
      - 'tests/inventory-public-*.test.ts'
      - 'server/inventory/**'
      - 'server/workflowEngine.ts'
      - 'server/automationTimerHandlers.ts'
      - 'tests/rge-*.test.ts'
      - 'client/src/components/agentPage/NeighborhoodPageSettings.tsx'
      - 'client/src/components/agentPage/NeighborhoodBoundaryEditor.tsx'
      - 'client/src/components/agentPage/NeighborhoodGuideVisualEditor.tsx'
      - 'server/routes/agentNeighborhoodPages.ts'
      - 'server/startupSchemaPatches.ts'
      - 'migrations/*agent_neighborhood*.sql'
      - 'tests/inventory-contact-*.test.ts'
      - 'tests/ai-domain-eligibility.test.ts'
      - '.github/workflows/rge-contact-eligibility.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Property intent, production date contamination and workflow boundaries
        run: >-
          node --import tsx --test
          tests/rge-production-date-contamination.test.ts
          tests/rge-review-search-evidence.test.ts
          tests/inventory-contact-eligibility.test.ts
          tests/inventory-contact-server-gate.test.ts
          tests/rge-focused-release-review.test.ts
          tests/ai-domain-eligibility.test.ts
      - name: Install Chromium for Agent Page viewport checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Agent Page publication, property SEO and existing lead workflows
        env:
          AGENT_PAGE_BROWSER_TEST: "1"
          RGE_PUBLIC_UX_SCREENSHOTS: "${{ runner.temp }}/rge-public-ux"
          RGE_MAP_SCREENSHOTS: "${{ runner.temp }}/rge-map-screenshots"
        run: >-
          node --import tsx --test
          tests/public-agent-page.test.ts
          tests/rge-neighborhood-drafts.test.ts
          tests/rge-neighborhood-local-guide.test.ts
          tests/rge-neighborhood-visual-editor.test.ts
          tests/rge-neighborhood-inline-photo-size.test.ts
          tests/rge-neighborhood-photo-editor-browser.test.ts
          tests/rge-public-branding-neighborhood-upload.test.ts
          tests/rge-neighborhood-blog-editor.test.ts
          tests/rge-neighborhood-verified-listings.test.ts
          tests/rge-neighborhood-municipal-providers.test.ts
          tests/rge-neighborhood-browse.test.ts
          tests/rge-neighborhood-custom-boundary.test.ts
          tests/rge-neighborhood-map-location.test.ts
          tests/public-agent-page-publication.test.ts
          tests/public-listings-sitemap.test.ts
          tests/public-listing-publication.test.ts
          tests/inventory-public-listing-seo.test.ts
          tests/inventory-listing-public-slug.test.ts
          tests/inventory-public-flyer.test.ts
          tests/growth-engine-pro-entitlement.test.ts
          tests/rge-webchat-readiness.test.ts
          tests/webchat-lead-flow.test.ts
          tests/buyer-qualification-scenarios.test.ts
          tests/pompano-sfh-cash-buyer-matching.test.ts
          tests/rge-w4-no-reply-enrollment.test.ts
          tests/calendly-booking-message.test.ts
          tests/seller-consultation-booking.test.ts
      - name: Upload Neighborhood Map Editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-map-editor-screenshots
          path: ${{ runner.temp }}/rge-map-screenshots/*.png
      - name: Upload public branding and neighborhood upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rge-public-branding-neighborhood-upload
          path: ${{ runner.temp }}/rge-public-ux/*.png
      - name: Compare TypeScript diagnostics against main
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - run: git diff --check
