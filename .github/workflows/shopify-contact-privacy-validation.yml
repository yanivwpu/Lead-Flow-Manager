name: Shopify contact privacy validation
on:
  pull_request:
    paths:
      - "shopify.app.staging.toml"
      - "scripts/validate-shopify-staging.py"
      - "tests/shopify-staging-config.test.py"
      - "server/shopifyWebhookRegistration.ts"
      - "tests/shopify-webhook-registration.test.ts"
      - "scripts/smoke-shopify-privacy-email.ts"
      - "railway/privacy-email-smoke*"
      - "docs/shopify-privacy-railway-one-shot.md"
      - "server/shopifyPrivacySmokeSafety.ts"
      - "tests/shopify-privacy-smoke-safety.test.ts"
      - "script/build.ts"
      - "docs/shopify-privacy-staging-smoke.md"
      - "server/shopify*.ts"
      - "shared/shopify*.ts"
      - "server/email.ts"
      - "server/storage.ts"
      - "server/cron.ts"
      - "server/routes.ts"
      - "client/src/pages/Admin.tsx"
      - "client/src/components/admin/AdminPrivacyOperationsTab.tsx"
      - "migrations/0105_shopify_privacy_automation.sql"
      - "migrations/0106_shopify_privacy_alert_email.sql"
      - "server/index.ts"
      - "docs/shopify-privacy-operations.md"
      - "server/commerceEventPipeline.ts"
      - "server/startupSchemaPatches.ts"
      - "shared/schema.ts"
      - "migrations/0104_shopify_contact_privacy.sql"
      - "client/src/pages/Pricing.tsx"
      - "client/src/components/integrations/ShopifyManagePanel.tsx"
      - "client/src/pages/AppLayout.tsx"
      - "docs/shopify-contact-privacy.md"
      - "client/src/components/Shopify*.tsx"
      - "client/src/lib/shopify*.ts"
      - "tests/shopify*.test.ts"
      - "tests/shopify*.test.tsx"
      - "scripts/check-types-against-base.mjs"
      - "scripts/process-shopify-privacy.ts"
      - "scripts/typecheck-diagnostic-normalization.mjs"
      - "tests/typecheck-diagnostic-normalization.test.mjs"
      - ".github/workflows/shopify-contact-privacy-validation.yml"
permissions:
  contents: read
jobs:
  contact-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopify_test
          POSTGRES_PASSWORD: shopify_test
          POSTGRES_DB: whachat_shopify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopify_test -d whachat_shopify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
      SHOPIFY_TEST_DATABASE_URL: postgres://shopify_test:shopify_test@127.0.0.1:5432/whachat_shopify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Contact capture, optional confirmation, and real PostgreSQL erasure
        run: |
          node --test tests/typecheck-diagnostic-normalization.test.mjs
          npx tsx --test tests/shopify-contact-privacy.test.tsx tests/shopify-support-contact-routes.test.ts tests/shopify-store-redaction-handler.test.ts
          npx tsx --test tests/shopify-customer-update.test.ts
          npx tsx --test tests/shopify-contact-privacy-postgres.test.ts
          npx tsx --test tests/shopify-privacy-worker-postgres.test.ts
          npx tsx --test tests/shopify-privacy-smoke-safety.test.ts
          npx tsx --test tests/shopify-privacy-one-shot.test.ts
          npx tsx --test tests/shopify-privacy-alert-email.test.ts
          npx tsx --test tests/shopify-privacy-verification.test.ts tests/shopify-customer-privacy-handler.test.ts tests/shopify-privacy-admin-routes.test.ts
      - name: Existing Shopify eligibility, billing, OAuth, and compliance regressions
        run: |
          npx tsx tests/shopify-shop-trial-ledger.test.ts
          npx tsx tests/shopify-shop-trial-reconciliation.test.ts
          npx tsx --test tests/shopify-managed-pricing.test.ts tests/shopify-oauth-state.test.ts tests/shopify-onboarding-emails.test.ts
      - name: Shopify one-click self-service with native PostgreSQL atomic rollback
        run: npx tsx --test tests/shopify-simple-order-support.test.ts tests/shopify-simple-order-support-postgres.test.ts
      - name: Reject TypeScript regressions against the exact PR base
        env:
          TYPECHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-types-against-base.mjs
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
